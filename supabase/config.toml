project_id = "dqeoxxokvvcpssajycgq"

[auth]
enabled = true
site_url = "https://main.d2uhqgjfktej3l.amplifyapp.com"
additional_redirect_urls = [
  "https://main.d2uhqgjfktej3l.amplifyapp.com",
  "https://main.d2uhqgjfktej3l.amplifyapp.com/definir-senha",
  "http://localhost:8080",
  "http://localhost:8080/definir-senha",
  "http://127.0.0.1:8080",
  "http://127.0.0.1:8080/definir-senha",
  "http://localhost:5173",
  "http://localhost:5173/definir-senha",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/definir-senha",
]

[auth.email]
max_frequency = "1m0s"
otp_length = 8

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.analisar-conta-pagar]
verify_jwt = false

# verify_jwt = false é obrigatório: a função faz a própria validação de sessão
# (assertAuthenticatedUser) e precisa responder o preflight OPTIONS sem JWT,
# senão o gateway barra o CORS e o cliente vê "Failed to send a request".
[functions.briefing-contas-pagar]
verify_jwt = false

[functions.marketing-events]
verify_jwt = false

[functions.marketing-offline-conversions]
# O pg_cron nao possui JWT de usuario. A funcao valida um segredo interno do
# Vault antes de tocar na fila privada e nas credenciais do Google Ads.
verify_jwt = false

[functions.gmail-oauth-callback]
verify_jwt = false

# verify_jwt = false e necessario porque a busca automatica e disparada por
# pg_cron com segredo interno. A propria funcao ainda valida JWT para chamadas
# do navegador e valida x-retiflow-cron-secret para chamadas agendadas.
[functions.gmail-scan-payables]
verify_jwt = false

[functions.gmail-auto-sync-dispatch]
verify_jwt = false

[functions.support-inbound]
verify_jwt = false

# A própria Function valida o bearer token com auth.getUser e precisa responder
# ao preflight OPTIONS antes de existir JWT no navegador.
[functions.note-pdf-url]
verify_jwt = false

# A própria Function valida o bearer token, o acesso ao movimento financeiro
# e, no modo suporte, a sessão exata antes de assinar o comprovante privado.
[functions.financeiro-anexo-url]
verify_jwt = false

# Webhook público da Meta: a própria Function valida x-hub-signature-256,
# restringe o número autorizado e só executa consultas fixas de leitura.
[functions.whatsapp-financeiro]
verify_jwt = false
